<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valyuta kurslari — banklar bo'yicha solishtirish</title>
<meta name="description" content="O'zbekiston banklaridagi dollar, yevro va rubl kurslari bir joyda. Qaysi bank qimmatga oladi, qaysi biri arzonga sotadi.">
<link rel="alternate" type="application/rss+xml" title="Kurslar" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF2EE;
    --surface:#FFFFFF;
    --ink:#16252A;
    --muted:#5E7078;
    --hair:#D6DDD7;
    --good:#0E6B50;
    --good-bg:#E1F0E8;
    --warn:#8E3A25;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Onest",system-ui,"Segoe UI",Roboto,sans-serif;
    font-size:17px; line-height:1.55;
  }
  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 72px}
  a{color:inherit}
  h1{font-size:20px;font-weight:500;margin:0;letter-spacing:-.01em}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  .official{color:var(--muted);font-size:15px}
  .num{font-variant-numeric:tabular-nums}

  /* boshqaruv */
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 0}
  .seg{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
  .seg button{
    appearance:none;border:0;background:none;font:inherit;font-size:15px;color:var(--muted);
    padding:9px 15px;cursor:pointer
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .seg button:focus-visible{outline:2px solid var(--good);outline-offset:-2px}

  /* javob bloki — sahifaning asosiy gapi */
  .answer{margin:30px 0 6px;font-size:clamp(26px,5.2vw,40px);line-height:1.18;font-weight:500;letter-spacing:-.02em;max-width:20ch}
  .answer b{font-weight:700}
  .answer .rate{display:block;margin-top:10px;font-weight:700;color:var(--good)}
  .answer-sub{color:var(--muted);font-size:15px;margin-bottom:32px}

  /* jadval */
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
  caption{text-align:left;color:var(--muted);font-size:14px;padding:0 0 8px}
  th,td{padding:13px 16px;text-align:right;border-bottom:1px solid var(--hair)}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:400;font-size:14px;color:var(--muted);background:#F7F9F7}
  tbody tr:last-child td{border-bottom:0}
  tr.best td{background:var(--good-bg)}
  tr.best td.hit{font-weight:700;color:var(--good)}
  tr.official td{color:var(--muted)}
  tr.stale td{color:#93A2A6}
  .tag{display:inline-block;margin-left:8px;font-size:12px;color:var(--muted);border:1px solid var(--hair);border-radius:20px;padding:1px 8px;vertical-align:1px}
  td.spread{color:var(--muted);font-size:15px}

  .empty{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:28px;color:var(--muted)}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--hair);color:var(--muted);font-size:14px}
  footer p{max-width:62ch}
  .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .links a{text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:1px}
  .links a:hover{border-color:var(--muted)}

  @media (max-width:560px){
    body{font-size:16px}
    th,td{padding:11px 12px}
    .hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>Banklardagi valyuta kurslari</h1>
    <div class="official num" id="official"></div>
  </div>

  <div class="controls">
    <div class="seg" id="currency-seg" role="group" aria-label="Valyuta"></div>
    <div class="seg" role="group" aria-label="Nima qilmoqchisiz">
      <button id="tab-sell" aria-pressed="true">Sotmoqchiman</button>
      <button id="tab-buy" aria-pressed="false">Olmoqchiman</button>
    </div>
  </div>

  <p class="answer" id="answer"></p>
  <p class="answer-sub" id="answer-sub"></p>

  <div id="table-slot"></div>

  <footer>
    <p id="disclaimer"></p>
    <div class="links" id="links"></div>
  </footer>
</div>

<script>
const state = { currency: "USD", mode: "sell", data: null };
const fmt = n => n == null ? "—" : new Intl.NumberFormat("ru-RU").format(Math.round(n));

async function boot(){
  const cur = await (await fetch("api/currencies.json")).json();
  const seg = document.getElementById("currency-seg");
  seg.innerHTML = cur.currencies.map(c =>
    `<button data-cur="${c}" aria-pressed="${c===state.currency}">${c}</button>`).join("");
  seg.onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    state.currency = b.dataset.cur;
    [...seg.children].forEach(x => x.setAttribute("aria-pressed", x === b));
    load();
  };
  document.getElementById("tab-sell").onclick = () => setMode("sell");
  document.getElementById("tab-buy").onclick  = () => setMode("buy");
  load();
}

function setMode(m){
  state.mode = m;
  document.getElementById("tab-sell").setAttribute("aria-pressed", m==="sell");
  document.getElementById("tab-buy").setAttribute("aria-pressed", m==="buy");
  render();
}

async function load(){
  const r = await fetch(`api/rates/${state.currency}.json`);
  state.data = await r.json();
  render();
}

function render(){
  const d = state.data, cur = d.currency;
  document.getElementById("disclaimer").textContent = d.disclaimer;
  document.getElementById("official").textContent =
    d.official ? `Markaziy bank kursi: ${fmt(d.official)} so'm` : "";

  // mode=sell → foydalanuvchi valyutani sotadi → bankning "oladi" narxi muhim
  const selling = state.mode === "sell";
  const best = selling ? d.best_buy : d.best_sell;
  const ans = document.getElementById("answer");
  const sub = document.getElementById("answer-sub");

  if (best){
    const v = selling ? best.buy : best.sell;
    ans.innerHTML = selling
      ? `${cur} ni bugun eng qimmatga <b>${best.name}</b> oladi<span class="rate num">${fmt(v)} so'm</span>`
      : `${cur} ni bugun eng arzonga <b>${best.name}</b> sotadi<span class="rate num">${fmt(v)} so'm</span>`;
    const when = new Date(best.fetched_at);
    sub.textContent = `Yangilangan: ${when.toLocaleString("uz-UZ", {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit"})}`;
  } else {
    ans.textContent = `${cur} bo'yicha banklardan ma'lumot olinmadi.`;
    sub.textContent = "Manbalar holatini pastdagi havoladan ko'rishingiz mumkin.";
  }

  document.getElementById("links").innerHTML = [
    [`api/rates/${cur}.json`, "JSON"],
    [`api/rates/${cur}.csv`,  "CSV"],
    ["feed.xml",              "RSS"],
    [`img/${cur}.png`,        "Rasm"],
    ["api/status.json",       "Manbalar holati"],
  ].map(([href, label]) => `<a href="${href}">${label}</a>`).join("");

  const rows = d.banks;
  const slot = document.getElementById("table-slot");
  if (!rows.length){
    slot.innerHTML = `<div class="empty">Hozircha ma'lumot yo'q.</div>`;
    return;
  }

  const sorted = [...rows].sort((a,b) => {
    if (a.kind !== b.kind) return a.kind === "official" ? -1 : 1;
    if (a.stale !== b.stale) return a.stale ? 1 : -1;
    return selling ? (b.buy||0) - (a.buy||0) : (a.sell||Infinity) - (b.sell||Infinity);
  });

  slot.innerHTML = `
  <table>
    <caption>${selling ? "Bank sizdan shu narxga oladi — yuqorisi foydali" : "Bank sizga shu narxga sotadi — pastrog'i foydali"}</caption>
    <thead><tr>
      <th>Bank</th><th>Oladi</th><th>Sotadi</th><th class="hide-sm">Farq</th>
    </tr></thead>
    <tbody>
    ${sorted.map(b => {
      const isBest = selling ? b.best_buy : b.best_sell;
      const cls = [b.kind==="official"?"official":"", b.stale?"stale":"", isBest?"best":""].join(" ");
      return `<tr class="${cls}">
        <td>${b.name}${b.stale ? '<span class="tag">eskirgan</span>' : ""}${b.origin==="manual" ? '<span class="tag">qoʻlda</span>' : ""}</td>
        <td class="num ${selling&&isBest?"hit":""}">${fmt(b.buy)}</td>
        <td class="num ${!selling&&isBest?"hit":""}">${fmt(b.sell)}</td>
        <td class="num spread hide-sm">${b.spread==null?"—":fmt(b.spread)}</td>
      </tr>`;
    }).join("")}
    </tbody>
  </table>`;
}

boot();
</script>
</body>
</html>
